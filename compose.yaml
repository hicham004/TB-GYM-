name: tb-gym

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbgym}
      POSTGRES_USER: ${POSTGRES_USER:-tbgym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The SignalR backplane, and only that. It is not a cache, not a queue and not a source of truth:
  # a send that happens while it is down is lost, which is exactly why the realtime event lives in
  # PostgreSQL and an authorized client can catch up on it afterwards. Nothing here is expected to
  # survive a restart, so persistence is switched off rather than left to write files nobody reads.
  #
  # The tag is pinned deliberately. `latest` would let a backplane change version between a passing
  # run and a failing one, which is the sort of variable that makes a delivery bug unreproducible.
  redis:
    image: redis:8.2.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # The upload scanner. Media publication fails closed without one: every upload is refused, which
  # is safe and completely silent, so the local stack runs the real daemon rather than pretending.
  #
  # Pinned by tag and digest. A scanner that changed feature version between a passing run and a
  # failing one would make an upload refusal unreproducible, and unlike the backplane this one
  # decides whether somebody's file is published at all. 1.5 is a currently supported ClamAV feature
  # version; the image bundles a signature database so the daemon can start without waiting on a
  # download, and freshclam keeps it current from then on.
  #
  # It runs as the image's own unprivileged clamav user, which means its unprivileged entrypoint,
  # which does not rewrite clamd.conf from environment variables - hence the mounted configuration
  # file. Port 3310 is exposed to the compose network and published to no host interface: clamd has
  # no authentication of its own, so being able to reach it must already mean being inside the
  # deployment.
  clamav:
    image: clamav/clamav:1.5.4@sha256:1fdfd24c6f0a0fb60788481487459a6d4eda8a9b448641594e04db8410d34422
    user: "clamav"
    entrypoint: ["/init-unprivileged"]
    environment:
      # Twice a day. The engine is only as good as the signatures behind it, and the verdict it
      # gives is recorded as durable evidence with the signature revision that produced it.
      FRESHCLAM_CHECKS: ${TB_GYM_CLAMAV_FRESHCLAM_CHECKS:-2}
      CLAMD_STARTUP_TIMEOUT: 300
    expose:
      - "3310"
    volumes:
      - clamav-data:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # ClamAV holds its whole signature database in memory. Roughly 4 GiB is what the project asks
    # for; below it the daemon is killed part-way through loading, which presents as an upload that
    # times out rather than as an out-of-memory container.
    mem_limit: ${TB_GYM_CLAMAV_MEMORY:-4g}
    healthcheck:
      # The image's own check: it asks the running daemon to answer, rather than looking for a
      # process. The start period is generous because loading the database is minutes of work on a
      # cold container.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 360s

  api:
    build:
      context: .
      dockerfile: src/backend/TB.Gym.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tbgym};Username=${POSTGRES_USER:-tbgym};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Database__ApplyMigrationsOnStartup: "true"
      DataProtection__KeyPath: /home/app/.aspnet/DataProtection-Keys
      Media__StorageRoot: /home/app/media
      Media__MaxWorkspaceStorageBytes: ${TB_GYM_MEDIA_WORKSPACE_QUOTA_BYTES:-21474836480}
      # Media providers. The local stack defaults to local files and the allow-everything development
      # scanner, because that is what a development machine can compose without a Cloudflare account.
      # Setting the storage adapter to R2 requires every R2 value below and refuses startup without
      # them; setting the scanner adapter to ClamAv points it at the daemon in this file. Neither
      # secret is defaulted: a credential that can write every workspace's media does not belong in a
      # committed file.
      Media__StorageAdapter: ${TB_GYM_MEDIA_STORAGE_ADAPTER:-Local}
      Media__R2__AccountId: ${TB_GYM_R2_ACCOUNT_ID:-}
      Media__R2__BucketName: ${TB_GYM_R2_BUCKET:-}
      Media__R2__AccessKeyId: ${TB_GYM_R2_ACCESS_KEY_ID:-}
      Media__R2__SecretAccessKey: ${TB_GYM_R2_SECRET_ACCESS_KEY:-}
      Media__ScannerAdapter: ${TB_GYM_MEDIA_SCANNER_ADAPTER:-Development}
      Media__ClamAv__Host: clamav
      Media__ClamAv__Port: "3310"
      # Whose word this deployment takes for a client's address and scheme. Off by default, which is
      # what the local stack wants and what a directly reachable deployment wants: X-Forwarded-For
      # and X-Forwarded-Proto are the caller's invention until an address says otherwise, and this
      # stack's nginx is not configured here as an edge. Turning it on without naming a proxy
      # refuses startup rather than accepting forwarded headers from nobody, which would collapse
      # every per-address rate limit onto one partition. The Worker has no HTTP surface and needs
      # none of this.
      ReverseProxy__Enabled: ${TB_GYM_REVERSE_PROXY_ENABLED:-false}
      ReverseProxy__TrustedProxies__0: ${TB_GYM_TRUSTED_PROXY:-}
      ReverseProxy__TrustedNetworks__0: ${TB_GYM_TRUSTED_PROXY_NETWORK:-}
      Seed__Enabled: ${TB_GYM_SEED_ENABLED:-true}
      Seed__AdminEmail: ${TB_GYM_ADMIN_EMAIL:-admin@tbgym.local}
      Seed__AdminPassword: ${TB_GYM_ADMIN_PASSWORD:-}
      # Realtime messaging. The local stack runs one API replica, so the in-process lifetime manager
      # is a correct backplane and Redis is only reached when the mode is switched to it. Declaring
      # more than one replica without switching the mode fails startup on purpose.
      Messaging__Realtime__ScaleOut: ${TB_GYM_REALTIME_SCALE_OUT:-SingleProcess}
      Messaging__Realtime__ApiReplicaCount: ${TB_GYM_API_REPLICAS:-1}
      Messaging__Realtime__RedisConnectionString: redis:6379
      # The origin the Angular container is served from. Explicit because a WebSocket handshake is
      # not protected by CORS, and a wildcard with credentials would let any site open an
      # authenticated socket as the signed-in user.
      Messaging__Realtime__AllowedOrigins__0: ${TB_GYM_HUB_ORIGIN:-http://localhost:4200}
      # Transactional email. Off by default: the local stack has no verified sending domain, and a
      # development container that could mail a real person by accident is a worse default than one
      # that cannot mail anybody. Setting the adapter to Resend requires every value below, and
      # startup refuses a half-configured provider whether or not the channel is enabled.
      Notifications__Email__Enabled: ${TB_GYM_EMAIL_ENABLED:-false}
      Notifications__Email__Adapter: ${TB_GYM_EMAIL_ADAPTER:-None}
      Notifications__Email__Provider__ApiKey: ${TB_GYM_EMAIL_API_KEY:-}
      Notifications__Email__Provider__FromAddress: ${TB_GYM_EMAIL_FROM:-}
      Notifications__Email__Provider__WebhookSigningSecret: ${TB_GYM_EMAIL_WEBHOOK_SECRET:-}
      Notifications__Email__Provider__FingerprintKeyId: ${TB_GYM_EMAIL_FINGERPRINT_KEY_ID:-}
      Notifications__Email__Provider__FingerprintKeys__${TB_GYM_EMAIL_FINGERPRINT_KEY_ID:-unset}: ${TB_GYM_EMAIL_FINGERPRINT_KEY:-}
      # The one origin every confirmation, password-reset and invitation link is built from. It is
      # configuration and never a request header: a host-header injection would turn a reset mail into
      # a credential-harvesting mail that the victim's own account legitimately triggered. Outside
      # Development it must be HTTPS and must appear in the allowlist beside it, and startup refuses
      # anything with credentials, a query, a fragment or a path.
      Application__PublicBaseUrl: ${TB_GYM_PUBLIC_ORIGIN:-http://localhost:4200}
      Application__PublicOriginAllowlist__0: ${TB_GYM_PUBLIC_ORIGIN:-http://localhost:4200}
      Application__ActionMail__MaximumAttempts: ${TB_GYM_ACTION_MAIL_MAX_ATTEMPTS:-4}
    ports:
      - "5134:8080"
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
      - media-data:/home/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Started, not healthy: the API composes its scanner from configuration and reports media
      # storage and scanning at /health/ready, so waiting minutes for a database load before the
      # rest of the application serves anything would be the wrong trade.
      clamav:
        condition: service_started

  # A second composition root of the same monolith, not a microservice: same image base, same
  # database, same domain assemblies, no HTTP surface and no migrations of its own. It waits for the
  # API because the API is what applies migrations locally; in production migrations are a separate
  # deployment step and the worker simply retries until the schema is there.
  #
  # It deliberately has no Redis dependency, no hub and no exposed port. Realtime publication needs an
  # IHubContext, which is only useful in a process that holds connections, so that sweep runs in the
  # API host and this one stays what it was.
  worker:
    build:
      context: .
      dockerfile: src/backend/TB.Gym.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=${POSTGRES_DB:-tbgym};Username=${POSTGRES_USER:-tbgym};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Notifications__Dispatch__PollIntervalSeconds: ${TB_GYM_NOTIFICATION_POLL_SECONDS:-5}
      Notifications__Dispatch__BatchSize: ${TB_GYM_NOTIFICATION_BATCH_SIZE:-25}
      Notifications__Dispatch__ClaimLeaseSeconds: ${TB_GYM_NOTIFICATION_LEASE_SECONDS:-120}
      Notifications__Dispatch__MaximumAttempts: ${TB_GYM_NOTIFICATION_MAX_ATTEMPTS:-6}
      # Transactional email. Off by default: the local stack has no verified sending domain, and a
      # development container that could mail a real person by accident is a worse default than one
      # that cannot mail anybody. Setting the adapter to Resend requires every value below, and
      # startup refuses a half-configured provider whether or not the channel is enabled.
      Notifications__Email__Enabled: ${TB_GYM_EMAIL_ENABLED:-false}
      Notifications__Email__Adapter: ${TB_GYM_EMAIL_ADAPTER:-None}
      Notifications__Email__Provider__ApiKey: ${TB_GYM_EMAIL_API_KEY:-}
      Notifications__Email__Provider__FromAddress: ${TB_GYM_EMAIL_FROM:-}
      Notifications__Email__Provider__WebhookSigningSecret: ${TB_GYM_EMAIL_WEBHOOK_SECRET:-}
      Notifications__Email__Provider__FingerprintKeyId: ${TB_GYM_EMAIL_FINGERPRINT_KEY_ID:-}
      Notifications__Email__Provider__FingerprintKeys__${TB_GYM_EMAIL_FINGERPRINT_KEY_ID:-unset}: ${TB_GYM_EMAIL_FINGERPRINT_KEY:-}
      # Action mail. The worker is what actually drains these two queues, so it needs the same
      # validated public origin the API has - it has no request to take one from even if that were
      # allowed, which is what makes configuration the only possible source here.
      Application__PublicBaseUrl: ${TB_GYM_PUBLIC_ORIGIN:-http://localhost:4200}
      Application__PublicOriginAllowlist__0: ${TB_GYM_PUBLIC_ORIGIN:-http://localhost:4200}
      Application__ActionMail__PollIntervalSeconds: ${TB_GYM_ACTION_MAIL_POLL_SECONDS:-5}
      Application__ActionMail__BatchSize: ${TB_GYM_ACTION_MAIL_BATCH_SIZE:-25}
      Application__ActionMail__ClaimLeaseSeconds: ${TB_GYM_ACTION_MAIL_LEASE_SECONDS:-120}
      Application__ActionMail__MaximumAttempts: ${TB_GYM_ACTION_MAIL_MAX_ATTEMPTS:-4}
      # The same data-protection key ring the API uses, and the same volume, deliberately. Confirmation
      # and reset tokens are protected payloads: this process mints them and the API unprotects them,
      # so two key rings would make every link this system sends fail on click, with an error that
      # reads as "invalid token" and is really a deployment mistake.
      DataProtection__KeyPath: /home/app/.aspnet/DataProtection-Keys
    volumes:
      - data-protection-keys:/home/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: src/web/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres-data:
  data-protection-keys:
  media-data:
  # The signature database. Persisted so a restart does not re-download several hundred megabytes,
  # and so freshclam's incremental updates have something to be incremental against.
  clamav-data:

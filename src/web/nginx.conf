# Which document answers "/" (UI plan R6.2a). The build renders the homepage as finished HTML,
# index.html, so Google and link previews can read it, and keeps the plain application shell as
# index.csr.html for every other address. A visitor who already signed in carries the session cookie,
# so "/" gives them the shell straight away rather than the homepage for the moment the app takes to
# find their session. The cookie is __Host-tb-gym.auth in production and tb-gym.auth in development
# (Infrastructure/DependencyInjection.cs); nginx cannot spell either as a $cookie_ variable, so the
# whole header is matched.
map $http_cookie $tb_gym_home_document {
    default                                   /index.html;
    "~(^|;\s*)(__Host-)?tb-gym\.auth="        /index.csr.html;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 501m;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Static files only. API JSON is left uncompressed: it carries per-user tokens over HTTPS, the
    # shape a compression side channel (BREACH) needs.
    gzip on;
    gzip_vary on;
    # The production edge adds a Via header, which nginx otherwise treats as "do not compress".
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:" always;

    # nginx's default table has no entry for .webmanifest, and a manifest sent as
    # application/octet-stream (with nosniff above) is not a manifest to every browser. This block
    # sets no headers of its own, so it still inherits the security headers.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The homepage or the shell, by the cookie (see the map above). Answered afresh on every visit,
    # because a copy kept from before signing in must not be shown to the person after: `expires`
    # sends Cache-Control: no-cache without replacing the inherited headers, as an add_header would.
    location = / {
        expires -1;
        try_files $tb_gym_home_document =404;
    }

    # What changed (UI plan R6.2f): rendered at build time like the homepage, the same for everyone.
    location = /changelog {
        expires -1;
        try_files /changelog/index.html =404;
    }

    # A deep link loads the plain shell, never the pre-rendered homepage: the app decides the page.
    location / {
        try_files $uri /index.csr.html;
    }

    location ~ ^/(api|health|hubs|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 30m;
        proxy_request_buffering off;
    }
}

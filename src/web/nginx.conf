# Whether the request carries the sign-in cookie: __Host-tb-gym.auth in production and tb-gym.auth in
# development (Infrastructure/DependencyInjection.cs). nginx cannot spell either as a $cookie_
# variable, so the whole header is matched.
map $http_cookie $tb_gym_visitor {
    default                                   visitor;
    "~(^|;\s*)(__Host-)?tb-gym\.auth="        signed-in;
}

# Which document answers the three addresses the build renders ahead of time (UI plan R6.2a, R6.2f,
# audit UIQ-13). A visitor gets the page rendered for nobody: the homepage and what changed as finished
# HTML that Google and link previews read, and sign-in, which draws its form before the scripts arrive.
# Someone who already signed in gets the plain shell, index.csr.html, as every other address does, so
# they never see a page rendered for nobody; that is why a page that arrives pre-rendered does not ask
# the API who is signed in (audit AUTH-12).
map "$tb_gym_visitor $uri" $tb_gym_document {
    default                       /index.csr.html;
    "visitor /"                   /index.html;
    "visitor /changelog"          /changelog/index.html;
    "visitor /auth/sign-in"       /auth/sign-in/index.html;
}

# How long a browser may keep what this server sends (audit WEB-4), by the file that answers: after
# try_files or an internal redirect, $uri names the file sent. A document (the shell or a pre-rendered
# page) is asked for afresh on every visit, so a release is seen at once and someone who signs in is
# never shown a copy kept from before; a file whose name carries its content's hash (the scripts and
# the stylesheet the build writes) never changes under that name, so it is kept for a year without a
# second request. Anything else (fonts, icons, pictures, the manifest, robots.txt) carries no header
# and the browser checks it again as it always has; the API's answers keep their own.
map $uri $tb_gym_cache_control {
    default                                                            "";
    "~\.html$"                                                         "no-cache";
    "~^/(chunk|main|polyfills|styles)-[A-Za-z0-9_-]{8,}\.(js|css)$"   "public, max-age=31536000, immutable";
}

# The Talk-to-us form (UI plan R6.2g): six requests a minute from one address, a short burst allowed,
# then 429. The production edge sends only this path through here (docker/caddy/Caddyfile), so the
# allowance counts the visitor's own address, read from the edge's X-Forwarded-For below.
limit_req_zone $binary_remote_addr zone=tb_gym_contact:1m rate=6r/m;

# Plausible's site script, kept for a few minutes so a hiccup at plausible.io does not reach the page.
proxy_cache_path /var/cache/nginx/tb-gym-stats levels=1:2 keys_zone=tb_gym_stats:1m inactive=1d max_size=10m;

server {
    listen 80;
    server_name _;
    client_max_body_size 501m;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Behind the production edge (compose.production.yaml gives it this fixed address) the visitor's
    # address is in X-Forwarded-For; from anywhere else the connection's own address stays. The
    # analytics proxy below resolves plausible.io at request time, through Docker's own resolver,
    # so this server still starts when the internet is not there yet.
    set_real_ip_from 172.30.0.10;
    real_ip_header X-Forwarded-For;
    resolver 127.0.0.11 valid=300s ipv6=off;

    # Static files only. API JSON is left uncompressed: it carries per-user tokens over HTTPS, the
    # shape a compression side channel (BREACH) needs.
    gzip on;
    gzip_vary on;
    # The production edge adds a Via header, which nginx otherwise treats as "do not compress".
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # connect-src 'self' covers the chat socket too: the only one is this host's own /hubs/chat, and a
    # browser lets 'self' open ws: and wss: to the page's own host (audit WEB-14).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;
    # Set from the map above; an empty value sends no header at all.
    add_header Cache-Control $tb_gym_cache_control always;

    # nginx's default table has no entry for .webmanifest, and a manifest sent as
    # application/octet-stream (with nosniff above) is not a manifest to every browser. This block
    # sets no headers of its own, so it still inherits the security headers.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The three pre-rendered addresses, each by the cookie (see the maps above). Each answer is a
    # document, so the cache map sends it with no-cache: a copy kept from before signing in is never
    # shown to the person after.
    location = / {
        try_files $tb_gym_document =404;
    }

    location = /changelog {
        try_files $tb_gym_document =404;
    }

    location = /auth/sign-in {
        try_files $tb_gym_document =404;
    }

    # A deep link loads the plain shell, never a pre-rendered page: the app decides the page, and says
    # itself when an address of the app does not exist.
    location / {
        try_files $uri /index.csr.html;
    }

    # Every 404 nginx gives itself (a missing file, at the end of this block) keeps its status and
    # carries the shell, so a person who follows a dead link sees the app's not-found page (audit
    # AUTH-10). The API's own 404s pass through untouched: proxied errors are not intercepted.
    error_page 404 /index.csr.html;

    # The Talk-to-us form's own allowance (see the zone above), then the API's.
    location = /api/website/contact-requests {
        limit_req zone=tb_gym_contact burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Analytics (UI plan R6.2g): Plausible's site script and its events pass through this origin, so
    # the page loads nothing from a third party and the CSP above stays as it is. The script's name
    # is the site's own (Website:Analytics:Script in the API's settings); nothing loads until the
    # owner sets it. No cookie is read or set on either path.
    location ~ "^/stats/(pa-[A-Za-z0-9_-]{1,64}\.js)$" {
        set $tb_gym_stats_script https://plausible.io/js/$1;
        proxy_pass $tb_gym_stats_script;
        proxy_set_header Host plausible.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_cache tb_gym_stats;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale updating error timeout invalid_header http_500;
    }

    location = /stats/event {
        set $tb_gym_stats_event https://plausible.io/api/event;
        proxy_pass $tb_gym_stats_event;
        proxy_set_header Host plausible.io;
        proxy_ssl_server_name on;
        proxy_buffering on;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location ~ ^/(api|health|hubs|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 30m;
        proxy_request_buffering off;
    }

    # The two rules below come after every proxied path, because nginx tries regular-expression
    # locations in the order they are written.

    # A pre-rendered page asked for by its file's name, or any address ending in a slash, gets the
    # shell: only the three addresses above choose by the cookie, so someone signed in is never handed
    # a page rendered for nobody by another spelling. The app takes /index.html to the homepage.
    location ~ (^|/)index\.html$|/$ {
        try_files /index.csr.html =404;
    }

    # A file that is not there, such as /sitemap.xml, a robots-style probe or a script from an older
    # release, answers 404, so a crawler is told the address does not exist (audit AUTH-10). The body
    # is the shell (error_page above), which shows a person the app's own not-found page. An address
    # without a file extension is a screen of the app, which says itself whether it exists.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }
}

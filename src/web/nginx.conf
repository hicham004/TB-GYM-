server {
    listen 80;
    server_name _;
    client_max_body_size 501m;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Static files only. API JSON is left uncompressed: it carries per-user tokens over HTTPS, the
    # shape a compression side channel (BREACH) needs.
    gzip on;
    gzip_vary on;
    # The production edge adds a Via header, which nginx otherwise treats as "do not compress".
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/plain application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:" always;

    # nginx's default table has no entry for .webmanifest, and a manifest sent as
    # application/octet-stream (with nosniff above) is not a manifest to every browser. This block
    # sets no headers of its own, so it still inherits the security headers.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(api|health|hubs|openapi)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 30m;
        proxy_request_buffering off;
    }
}

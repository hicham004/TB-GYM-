<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TB Gym</title>
    <meta
      name="description"
      content="TB Gym brings training, nutrition, check-ins, progress, and client conversations together for coaches and teams."
    />
    <meta name="theme-color" content="#f5f3ea" />
    <!--
      Link previews (WhatsApp, Instagram, iMessage, LinkedIn). Crawlers do not run the app, so the
      tags live here and cover every route. og:image is relative until a production origin exists;
      docs/LAUNCH-CHECKLIST.md has the step that makes it absolute, which WhatsApp requires.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TB Gym" />
    <meta property="og:title" content="TB Gym: stop coaching from chats and spreadsheets" />
    <meta
      property="og:description"
      content="Training, meal plans, check-ins, progress and messages for every client, in one place. For personal trainers, coaches and gyms."
    />
    <meta property="og:image" content="/images/og-home.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="TB Gym: a coach guiding a client through a barbell lift, beside the headline Stop coaching from chats and spreadsheets."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The homepage headline's faces, fetched with the document so the headline does not reflow. -->
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex/IBMPlexSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif/InstrumentSerif-Italic-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <base href="/" />
    <!-- viewport-fit=cover lets the client's bottom tabs pad themselves clear of the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Action links carry a single-use credential in the query string until the page exchanges it.
      The API and the production nginx configuration both send `Referrer-Policy: no-referrer`, and
      this repeats it in the document so the guarantee survives a development server, a static
      preview or any host that does not set the header - a subresource or an outbound click must
      never be able to carry a reset or invitation token to a third party.
    -->
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

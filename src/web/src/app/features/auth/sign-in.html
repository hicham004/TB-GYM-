<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow" i18n>Coach and client access</p>
    <h1 i18n>Welcome back</h1>
    <p i18n>Sign in to your coaching workspace.</p>
  </div>

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label>
      <span i18n>Email</span>
      <input type="email" formControlName="email" autocomplete="username" />
    </label>
    <label>
      <span i18n>Password</span>
      <input type="password" formControlName="password" autocomplete="current-password" />
    </label>
    <div class="form-row between">
      <label class="check-field">
        <input type="checkbox" formControlName="rememberMe" />
        <span i18n>Keep me signed in</span>
      </label>
      <a routerLink="/auth/forgot-password" i18n>Forgot password?</a>
    </div>

    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button class="primary-button" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span i18n>Signing in...</span>
      } @else {
        <span i18n>Sign in</span>
      }
    </button>

    <p class="form-footer">
      <span i18n>Independent coach?</span>
      <a routerLink="/auth/register" i18n>Create your workspace</a>
    </p>
  </form>
</section>

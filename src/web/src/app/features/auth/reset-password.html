<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow" i18n>Account recovery</p>
    <h1 i18n>Choose a new password</h1>
    <p i18n>Resetting your password signs out existing sessions.</p>
  </div>

  <div class="auth-form">
    @if (!validLink) {
      <p class="form-error" i18n>This reset link is incomplete.</p>
    } @else if (complete()) {
      <h2 i18n>Password updated</h2>
      <a class="primary-button" routerLink="/auth/sign-in" i18n>Sign in</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          <span i18n>New password</span>
          <input type="password" formControlName="password" autocomplete="new-password" />
        </label>
        <label>
          <span i18n>Confirm new password</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password" />
        </label>
        @if (error()) {
          <p class="form-error" role="alert">{{ error() }}</p>
        }
        <button class="primary-button" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <span i18n>Updating...</span>
          } @else {
            <span i18n>Update password</span>
          }
        </button>
      </form>
    }
  </div>
</section>

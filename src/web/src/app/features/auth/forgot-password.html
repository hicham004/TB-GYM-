<section class="auth-layout">
  <div class="auth-copy">
    <p class="eyebrow" i18n>Account recovery</p>
    <h1 i18n>Reset your password</h1>
    <p i18n>Enter the email connected to your TB Gym account.</p>
  </div>

  <div class="auth-form">
    @if (result(); as response) {
      <h2 i18n>Check your email</h2>
      <p>{{ response.message }}</p>
      @if (response.developmentActionUrl) {
        <a class="primary-button" [href]="response.developmentActionUrl" i18n
          >Open development reset</a
        >
      }
      <a routerLink="/auth/sign-in" i18n>Return to sign in</a>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label>
          <span i18n>Email</span>
          <input type="email" formControlName="email" autocomplete="email" />
        </label>
        @if (error()) {
          <p class="form-error" role="alert">{{ error() }}</p>
        }
        <button class="primary-button" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            <span i18n>Sending...</span>
          } @else {
            <span i18n>Send reset link</span>
          }
        </button>
      </form>
    }
  </div>
</section>

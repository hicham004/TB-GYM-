<app-auth-frame>
  <p class="auth-eyebrow" i18n>Email verification</p>
  <h1 class="auth-title" i18n>Confirm your <em>account.</em></h1>

  <div class="auth-stack" aria-live="polite">
    @switch (state()) {
      @case ('working') {
        <p class="auth-muted" i18n>Confirming your email...</p>
      }
      @case ('success') {
        <h2 class="auth-subtitle" i18n>Email confirmed</h2>
        <a appButton size="touch" class="auth-submit" routerLink="/auth/sign-in" i18n
          >Continue to sign in</a
        >
      }
      @case ('error') {
        <p class="auth-message auth-message--error">{{ error() }}</p>
        <p><a class="auth-link" routerLink="/auth/sign-in" i18n>Return to sign in</a></p>
      }
    }
  </div>
</app-auth-frame>

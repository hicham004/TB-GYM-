<app-settings-frame>
  <header settingsHead class="top">
    <h1 i18n>Appearance</h1>
    <p class="lede" i18n>
      Choose the view that feels right. Your choice follows you to every coaching space and device.
    </p>
  </header>
  <section class="panel appearance">
    <fieldset [disabled]="saving()">
      <legend i18n>Colour mode</legend>
      @for (mode of modes; track mode.value) {
        <label class="mode" [class.selected]="selected() === mode.value">
          <input
            #modeInput
            type="radio"
            name="mode"
            [value]="mode.value"
            [checked]="selected() === mode.value"
            (change)="choose(mode.value)"
          />
          <span class="mode-copy"
            ><strong>{{ mode.label }}</strong
            ><small>{{ mode.description }}</small></span
          >
        </label>
      }
    </fieldset>
    @if (saving()) {
      <p class="quiet" role="status" i18n>Saving your choice…</p>
    }
    @if (error()) {
      <p class="save-error" role="alert" i18n>Couldn’t save your choice. Try again.</p>
    }
  </section>
</app-settings-frame>

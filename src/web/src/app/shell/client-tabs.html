<nav class="client-tabs tb-theme" aria-label="Client navigation" i18n-aria-label>
  <ul>
    @for (tab of tabs(); track tab.key) {
      @let current = state(tab);
      <li>
        <a
          class="tab"
          [routerLink]="tab.link"
          [class.selected]="current !== null"
          [attr.aria-current]="current === 'page' ? 'page' : current === 'section' ? 'true' : null"
        >
          <span class="glyph">
            <app-icon [name]="tab.icon" />
            @if (tab.key === 'messages' && unread() > 0) {
              <span class="count" aria-hidden="true">{{ unreadCount() }}</span>
            }
          </span>
          <span class="label">{{ tab.label }}</span>
          @if (tab.key === 'messages' && unread() > 0) {
            <!-- Announced on focus, not as it changes; the space before it keeps it apart from the label. -->
            <span class="tb-visually-hidden" i18n
              >,
              {unread(), plural,
                =1 {1 unread message}
                other {{{ unreadText() }} unread messages}
              }</span
            >
          }
        </a>
      </li>
    }
  </ul>
</nav>

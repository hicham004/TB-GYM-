# clamd configuration for the TB Gym media scanner.
#
# Mounted read-only over the image's own /etc/clamav/clamd.conf. The official image can also be
# configured through CLAMD_CONF_* environment variables, but only from its privileged entrypoint;
# this container runs as a non-root user, whose entrypoint does not rewrite the file. Shipping the
# file is the honest way to configure a container that does not run as root.
#
# Everything not stated here keeps the daemon's own default.

# The bundled and freshclam-updated signature database, on a persistent volume so a restart does
# not re-download it.
DatabaseDirectory /var/lib/clamav

LogFile /var/log/clamav/clamd.log
LogTime yes

# The entrypoint waits for this socket before reporting the daemon started, so it is not optional.
LocalSocket /tmp/clamd.sock

# The API talks INSTREAM over TCP. The address is explicit because clamd binds to loopback when it
# is not, which inside a container means nothing on the compose network can reach it. The port is
# published to no host interface: this daemon has no authentication of its own, so reaching it must
# require being on the private network already.
TCPSocket 3310
TCPAddr 0.0.0.0

# The size ceilings, and the reason they are here rather than left at their defaults. A media upload
# may be a 500 MiB video, and clamd answers a stream larger than StreamMaxLength with an error
# rather than a verdict; the defaults (25 MB scan, 25 MB file, 25 MB stream) would turn every video
# upload into an operational scanner failure and a 503. MaxScanSize sits above MaxFileSize because
# it bounds the total data examined including anything extracted from an archive or container
# format, which is larger than the file itself.
#
# These are limits, not allowances: exceeding one is an error the application treats as "not
# scanned", never as "clean".
StreamMaxLength 600M
MaxFileSize 600M
MaxScanSize 700M

# Milliseconds. A 500 MiB video is minutes of engine work on a small container, and the default two
# minutes would abandon it; the application's own scan timeout is the outer bound.
MaxScanTime 300000

# A signature-database reload otherwise holds two complete databases in memory at once, which
# roughly doubles the peak the 4 GiB reservation has to cover. Reloading in place blocks scans for
# a few seconds instead, which is the better trade for a handful of uploads a day.
ConcurrentDatabaseReload no

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__Database: Host=localhost;Port=5433;Database=postgres;Username=tbgym
      TB_GYM_TEST_ADMIN_CONNECTION: Host=localhost;Port=5433;Database=postgres;Username=tbgym;Pooling=false
      TB_GYM_REQUIRE_POSTGRES_TESTS: "true"
      # The realtime suite starts its own pinned Redis container per test, because the outage test
      # stops one and the suite runs methods in parallel. This makes a missing Docker daemon a
      # failure rather than a quietly skipped proof of the scale-out path.
      TB_GYM_REQUIRE_REDIS_TESTS: "true"
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: tbgym
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tbgym -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      # Pulled once, up front, so a test that starts its own backplane is not also waiting on a
      # registry. Pinned to the same tag compose.yaml uses.
      - name: Pre-pull the pinned Redis image
        run: docker pull redis:8.2.2-alpine
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore TB.Gym.slnx
      - name: Verify formatting
        run: dotnet format analyzers TB.Gym.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build TB.Gym.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TB.Gym.slnx --configuration Release --no-build
      - name: Verify EF model and migrations agree
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/backend/TB.Gym.Infrastructure/TB.Gym.Infrastructure.csproj \
            --startup-project src/backend/TB.Gym.Api/TB.Gym.Api.csproj \
            --no-build \
            --configuration Release
      # Production migrations are one deliberate job that executes a self-contained bundle, never an
      # API migrating at startup. These steps prove the repository's own generator end to end: the
      # bundle is built with a placeholder connection, and then the bundle - not dotnet ef, and not
      # an application image - migrates a freshly created database whose connection it receives only
      # as ConnectionStrings__Database, the way a deployment secret store injects it, with no
      # --connection. linux-x64 is what this runner executes. It says nothing about the beta host,
      # whose runtime the Deployment owner chooses.
      - name: Build a migration bundle with the repository's generator
        shell: pwsh
        env:
          ConnectionStrings__Database: Host=unused;Database=unused;Username=unused;Password=unused
        run: ./scripts/build-migration-bundle.ps1 -RuntimeIdentifier linux-x64 -OutputPath "$env:RUNNER_TEMP/efbundle-linux-x64/efbundle"
      - name: The bundle migrates a fresh database
        shell: bash
        env:
          # A placeholder that names no reachable server, in place of the job's own value, so the
          # only connection the bundle can use is the one injected into its environment below.
          ConnectionStrings__Database: Host=unused;Database=unused;Username=unused;Password=unused
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          database=tbgym_bundle_proof
          docker exec "$POSTGRES_CONTAINER" createdb -U tbgym "$database"
          # Injected into the bundle's environment alone, assembled here rather than declared under
          # env so no step prints it, and no --connection: the production job's shape.
          ConnectionStrings__Database="Host=localhost;Port=5433;Database=$database;Username=tbgym" \
            "$RUNNER_TEMP/efbundle-linux-x64/efbundle"
          # Every migration in the repository, and nothing else, is now recorded as applied.
          find src/backend/TB.Gym.Infrastructure/Persistence/Migrations -maxdepth 1 \
              -name '[0-9]*_*.cs' ! -name '*.Designer.cs' -printf '%f\n' \
            | sed 's/\.cs$//' | LC_ALL=C sort > "$RUNNER_TEMP/migrations-expected.txt"
          docker exec "$POSTGRES_CONTAINER" psql -U tbgym -d "$database" -tA -v ON_ERROR_STOP=1 \
              -c 'SELECT "MigrationId" FROM platform."__EFMigrationsHistory"' \
            | LC_ALL=C sort > "$RUNNER_TEMP/migrations-applied.txt"
          test -s "$RUNNER_TEMP/migrations-expected.txt"
          diff -u "$RUNNER_TEMP/migrations-expected.txt" "$RUNNER_TEMP/migrations-applied.txt"
      - name: Upload the CI migration bundle
        uses: actions/upload-artifact@v4
        with:
          name: efbundle-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/efbundle-linux-x64/efbundle
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm install --global npm@11.17.0
      - run: npm ci
        working-directory: src/web
      - run: npm run format:check
        working-directory: src/web
      - run: npm run lint
        working-directory: src/web
      - run: npm run build
        working-directory: src/web
      - run: npm test
        working-directory: src/web
      - run: npm audit --audit-level=high
        working-directory: src/web

  containers:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file src/backend/TB.Gym.Api/Dockerfile --tag tb-gym-api:ci .
      - run: docker build --file src/backend/TB.Gym.Worker/Dockerfile --tag tb-gym-worker:ci .
      - name: Start the built Worker image
        run: |
          docker run --detach --name tb-gym-worker-ci-smoke \
            --env 'ConnectionStrings__Database=Host=unused;Database=unused;Username=unused;Password=unused' \
            --env DataProtection__KeyPath=/tmp/tb-gym-keys \
            --env Application__PublicBaseUrl=https://app.example.com \
            --env Application__PublicOriginAllowlist__0=https://app.example.com \
            --env Notifications__Dispatch__Enabled=false \
            tb-gym-worker:ci
          trap 'docker rm --force tb-gym-worker-ci-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          test "$(docker inspect --format '{{.State.Running}}' tb-gym-worker-ci-smoke)" = "true"
          docker logs tb-gym-worker-ci-smoke 2>&1 | grep 'Notification dispatch is disabled by configuration.'
      # Phase 6B-2B added realtime delivery to the API and deliberately nothing to the Worker. This
      # is what says so about the artefact rather than about the source: no exposed port, no hub, no
      # Redis client in the image, and no realtime startup line.
      - name: The Worker image has no listener, no hub and no backplane
        run: |
          test -z "$(docker image inspect tb-gym-worker:ci --format '{{json .Config.ExposedPorts}}' | grep -v null || true)"
          docker run --rm --entrypoint sh tb-gym-worker:ci -c 'ls /app | grep -i signalr' && exit 1 || true
          docker run --rm --entrypoint sh tb-gym-worker:ci -c 'ls /app | grep -i "StackExchange.Redis"' && exit 1 || true
          docker logs tb-gym-worker-ci-smoke 2>&1 | grep -q 'Realtime messaging' && exit 1 || true
      - name: The API image starts with a Redis backplane and one declared replica each
        run: |
          docker network create tb-gym-ci-net
          trap 'docker rm --force tb-gym-redis-ci tb-gym-api-ci >/dev/null 2>&1 || true; docker network rm tb-gym-ci-net >/dev/null 2>&1 || true' EXIT
          docker run --detach --name tb-gym-redis-ci --network tb-gym-ci-net \
            redis:8.2.2-alpine redis-server --save '' --appendonly no
          for _ in $(seq 1 30); do
            docker exec tb-gym-redis-ci redis-cli ping >/dev/null 2>&1 && break
            sleep 1
          done
          # Several declared replicas with a backplane: the API must start.
          docker run --detach --name tb-gym-api-ci --network tb-gym-ci-net \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'ConnectionStrings__Database=Host=unused;Database=unused;Username=unused;Password=unused' \
            --env DataProtection__KeyPath=/tmp/tb-gym-keys \
            --env Application__PublicBaseUrl=https://app.example.com \
            --env Application__PublicOriginAllowlist__0=https://app.example.com \
            --env Database__ApplyMigrationsOnStartup=false \
            --env Messaging__Realtime__Enabled=false \
            --env Messaging__Realtime__ScaleOut=Redis \
            --env Messaging__Realtime__ApiReplicaCount=2 \
            --env Messaging__Realtime__RedisConnectionString=tb-gym-redis-ci:6379 \
            --env Messaging__Realtime__AllowedOrigins__0=https://app.example.com \
            tb-gym-api:ci
          sleep 6
          test "$(docker inspect --format '{{.State.Running}}' tb-gym-api-ci)" = "true"
          docker logs tb-gym-api-ci 2>&1 | grep 'Realtime messaging is configured for Redis'
          # And the backplane endpoint is never printed.
          docker logs tb-gym-api-ci 2>&1 | grep -q 'tb-gym-redis-ci:6379' && exit 1 || true
          docker rm --force tb-gym-api-ci >/dev/null
          # Several declared replicas without a backplane: the API must refuse to start.
          docker run --name tb-gym-api-ci --network tb-gym-ci-net \
            --env ASPNETCORE_ENVIRONMENT=Production \
            --env 'ConnectionStrings__Database=Host=unused;Database=unused;Username=unused;Password=unused' \
            --env DataProtection__KeyPath=/tmp/tb-gym-keys \
            --env Application__PublicBaseUrl=https://app.example.com \
            --env Application__PublicOriginAllowlist__0=https://app.example.com \
            --env Database__ApplyMigrationsOnStartup=false \
            --env Messaging__Realtime__ApiReplicaCount=3 \
            --env Messaging__Realtime__AllowedOrigins__0=https://app.example.com \
            tb-gym-api:ci && exit 1 || true
          docker logs tb-gym-api-ci 2>&1 | grep 'ScaleOut must be Redis'
      - run: docker build --file src/web/Dockerfile --tag tb-gym-web:ci .
      - name: The compose stack is valid, including the pinned backplane
        env:
          POSTGRES_PASSWORD: compose-config-check
        run: |
          docker compose config --quiet
          docker compose config | grep 'image: redis:8.2.2-alpine'
